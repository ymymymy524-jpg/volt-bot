<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Volt System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0a0a15;
            color: #ffffff;
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            z-index: -2;
            animation: bgPulse 10s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════ */
        /* 🎨 Login Card */
        /* ═══════════════════════════════════════ */
        .login-container {
            max-width: 450px;
            width: 90%;
            padding: 20px;
        }

        .login-card {
            background: rgba(19, 19, 31, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.7);
            animation: logoPulse 2s ease-in-out infinite;
        }

        .login-logo i {
            font-size: 2.5rem;
            color: #ffffff;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .login-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #06b6d4);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 3s ease infinite;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .login-subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(139, 92, 246, 0.8);
            color: #ffffff;
        }

        .btn-discord.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-discord.loading i.fa-spinner {
            animation: spin 1s linear infinite;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: right;
        }

        .error-message i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #8b5cf6;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 40px 25px;
            }
            .login-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <!-- 🎨 Logo -->
            <div class="login-logo">
                <i class="fas fa-bolt"></i>
            </div>

            <!-- 📝 Title -->
            <h1 class="login-title">Volt System</h1>
            <p class="login-subtitle">
                سجل دخولك للتحكم في سيرفرك<br>
                من خلال حسابك على ديسكورد
            </p>

            <!-- ⚠️ Error Message -->
            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- 🔐 Discord Login Button -->
            <a href="{{ discord_login_url }}" 
               class="btn-discord" 
               id="login-btn"
               onclick="showLoading(event)">
                <i class="fab fa-discord"></i>
                <span>تسجيل الدخول بـ Discord</span>
            </a>

            <!-- 🔙 Back Link -->
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>العودة للصفحة الرئيسية</span>
            </a>

        </div>
    </div>

    <script>
        function showLoading(event) {
            const btn = document.getElementById('login-btn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i><span>جاري التحويل...</span>';
        }
    </script>

</body>
</html>
