{% extends "base.html" %}

{% block content %}
<!-- عنوان الصفحة -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">
        <i class="fas fa-history text-info me-2"></i>
        سجلات النظام
    </h2>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-success btn-sm" onclick="exportCSV()">
            <i class="fas fa-file-csv me-1"></i> تصدير CSV
        </button>
        <button class="btn btn-outline-primary btn-sm" onclick="loadLogs()">
            <i class="fas fa-sync-alt me-1"></i> تحديث
        </button>
    </div>
</div>

<!-- كروت الإحصائيات -->
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">إجمالي السجلات</p>
                        <h3 class="fw-bold mb-0" id="total-logs">0</h3>
                    </div>
                    <div class="stats-icon bg-primary bg-opacity-10 text-primary">
                        <i class="fas fa-list"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">سجلات Bitcoin</p>
                        <h3 class="fw-bold mb-0 text-warning" id="bitcoin-logs">0</h3>
                    </div>
                    <div class="stats-icon bg-warning bg-opacity-10 text-warning">
                        <i class="fas fa-coins"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">سجلات الأوامر</p>
                        <h3 class="fw-bold mb-0 text-success" id="command-logs">0</h3>
                    </div>
                    <div class="stats-icon bg-success bg-opacity-10 text-success">
                        <i class="fas fa-terminal"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">سجلات الحماية</p>
                        <h3 class="fw-bold mb-0 text-danger" id="protection-logs">0</h3>
                    </div>
                    <div class="stats-icon bg-danger bg-opacity-10 text-danger">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- شريط البحث والفلترة -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-bold small">نوع السجل</label>
                <select class="form-select" id="log-type-filter" onchange="filterLogs()">
                    <option value="all">📋 جميع السجلات</option>
                    <option value="bitcoin">💰 Bitcoin</option>
                    <option value="command">🎮 الأوامر</option>
                    <option value="protection">🛡️ الحماية</option>
                    <option value="admin">⚙️ الإدارة</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">الإجراء</label>
                <select class="form-select" id="action-filter" onchange="filterLogs()">
                    <option value="all">📋 جميع الإجراءات</option>
                    <option value="daily">🎁 المكافأة اليومية</option>
                    <option value="work">💼 العمل</option>
                    <option value="transfer_in">📥 تحويل وارد</option>
                    <option value="transfer_out">📤 تحويل صادر</option>
                    <option value="buy">🛒 شراء</option>
                    <option value="admin">⚙️ تعديل إداري</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">بحث</label>
                <div class="input-group">
                    <span class="input-group-text bg-light">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="search-input" 
                        placeholder="ابحث في السجلات..."
                        oninput="filterLogs()"
                    >
                </div>
            </div>
        </div>
    </div>
</div>

<!-- جدول السجلات -->
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">
                <i class="fas fa-clipboard-list text-primary me-2"></i>
                قائمة السجلات
            </h5>
            <div class="text-muted small">
                عرض <span id="showing-count">0</span> من <span id="total-count">0</span> سجل
            </div>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">الوقت</th>
                        <th>النوع</th>
                        <th>الإجراء</th>
                        <th>المستخدم</th>
                        <th>التفاصيل</th>
                        <th>المبلغ</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جاري التحميل...</span>
                            </div>
                            <p class="text-muted mt-2">جاري تحميل السجلات...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Pagination -->
    <div class="card-footer bg-white border-0 py-3">
        <div class="d-flex justify-content-between align-items-center">
            <div class="text-muted small">
                <button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">
                    <i class="fas fa-times me-1"></i> مسح الفلاتر
                </button>
            </div>
            <nav aria-label="التنقل بين الصفحات">
                <ul class="pagination pagination-sm mb-0" id="pagination">
                </ul>
            </nav>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allLogs = [];
    let filteredLogs = [];
    let currentPage = 1;
    const logsPerPage = 20;

    // تحميل السجلات من API
    async function loadLogs() {
        try {
            const response = await fetch('/api/logs');
            const result = await response.json();
            
            if (result.success) {
                allLogs = result.data;
                updateStats();
                filterLogs();
            } else {
                showNotification('خطأ في تحميل السجلات', 'danger');
            }
        } catch (error) {
            console.error('خطأ:', error);
            showNotification('حدث خطأ في الاتصال', 'danger');
        }
    }

    // تحديث الإحصائيات
    function updateStats() {
        const total = allLogs.length;
        const bitcoin = allLogs.filter(l => l.type === 'bitcoin').length;
        const command = allLogs.filter(l => l.type === 'command').length;
        const protection = allLogs.filter(l => l.type === 'protection').length;
        
        document.getElementById('total-logs').textContent = total.toLocaleString('ar-EG');
        document.getElementById('bitcoin-logs').textContent = bitcoin.toLocaleString('ar-EG');
        document.getElementById('command-logs').textContent = command.toLocaleString('ar-EG');
        document.getElementById('protection-logs').textContent = protection.toLocaleString('ar-EG');
    }

    // فلترة السجلات
    function filterLogs() {
        const logType = document.getElementById('log-type-filter').value;
        const action = document.getElementById('action-filter').value;
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        
        filteredLogs = allLogs.filter(log => {
            // فلترة بالنوع
            if (logType !== 'all' && log.type !== logType) {
                return false;
            }
            
            // فلترة بالإجراء
            if (action !== 'all' && log.action !== action) {
                return false;
            }
            
            // فلترة بالبحث
            if (searchTerm) {
                const searchIn = [
                    log.user_id,
                    log.details,
                    log.action,
                    log.type
                ].join(' ').toLowerCase();
                
                if (!searchIn.includes(searchTerm)) {
                    return false;
                }
            }
            
            return true;
        });
        
        currentPage = 1;
        renderLogs();
        renderPagination();
    }

    // عرض السجلات في الجدول
    function renderLogs() {
        const tbody = document.getElementById('logs-table-body');
        const start = (currentPage - 1) * logsPerPage;
        const end = start + logsPerPage;
        const pageLogs = filteredLogs.slice(start, end);
        
        if (pageLogs.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <p class="text-muted mb-0">لا توجد سجلات مطابقة</p>
                    </td>
                </tr>
            `;
            document.getElementById('showing-count').textContent = '0';
            document.getElementById('total-count').textContent = '0';
            return;
        }
        
        tbody.innerHTML = pageLogs.map(log => {
            const icon = getLogIcon(log.action);
            const color = getLogColor(log.action);
            const typeColor = getTypeColor(log.type);
            const amountClass = log.amount > 0 ? 'text-success' : log.amount < 0 ? 'text-danger' : 'text-muted';
            const amountSign = log.amount > 0 ? '+' : '';
            
            return `
                <tr>
                    <td class="ps-4 align-middle">
                        <small class="text-muted">${formatDateTime(log.timestamp)}</small>
                    </td>
                    <td class="align-middle">
                        <span class="badge bg-${typeColor} bg-opacity-10 text-${typeColor}">
                            ${getTypeName(log.type)}
                        </span>
                    </td>
                    <td class="align-middle">
                        <span class="badge bg-${color} bg-opacity-10 text-${color}">
                            <i class="${icon} me-1"></i>
                            ${getActionName(log.action)}
                        </span>
                    </td>
                    <td class="align-middle">
                        <code class="small">${log.user_id}</code>
                    </td>
                    <td class="align-middle text-muted">
                        ${log.details || '-'}
                    </td>
                    <td class="align-middle">
                        ${log.amount !== undefined ? `
                            <span class="${amountClass} fw-bold">
                                ${amountSign}${log.amount.toLocaleString('ar-EG')} ₿
                            </span>
                        ` : '-'}
                    </td>
                </tr>
            `;
        }).join('');
        
        document.getElementById('showing-count').textContent = pageLogs.length;
        document.getElementById('total-count').textContent = filteredLogs.length;
    }

    // عرض Pagination
    function renderPagination() {
        const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = '';
        
        // زر السابق
        html += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        `;
        
        // أرقام الصفحات
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>
                `;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
        }
        
        // زر التالي
        html += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
        `;
        
        pagination.innerHTML = html;
    }

    // تغيير الصفحة
    function changePage(page) {
        const totalPages = Math.ceil(filteredLogs.length / logsPerPage);
        if (page < 1 || page > totalPages) return;
        
        currentPage = page;
        renderLogs();
        renderPagination();
        
        // التمرير لأعلى الجدول
        document.querySelector('.table-responsive').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // مسح الفلاتر
    function clearFilters() {
        document.getElementById('log-type-filter').value = 'all';
        document.getElementById('action-filter').value = 'all';
        document.getElementById('search-input').value = '';
        filterLogs();
    }

    // تصدير CSV
    function exportCSV() {
        if (filteredLogs.length === 0) {
            showNotification('لا توجد سجلات للتصدير', 'warning');
            return;
        }
        
        // إنشاء محتوى CSV
        let csv = 'الوقت,النوع,الإجراء,المستخدم,التفاصيل,المبلغ\n';
        
        filteredLogs.forEach(log => {
            const time = formatDateTime(log.timestamp);
            const type = getTypeName(log.type);
            const action = getActionName(log.action);
            const user = log.user_id;
            const details = log.details || '';
            const amount = log.amount !== undefined ? log.amount : '';
            
            csv += `"${time}","${type}","${action}","${user}","${details}","${amount}"\n`;
        });
        
        // إنشاء Blob وتحميله
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `logs_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showNotification('تم تصدير السجلات بنجاح', 'success');
    }

    // دوال مساعدة
    function getLogIcon(action) {
        const icons = {
            'daily': 'fas fa-gift',
            'work': 'fas fa-briefcase',
            'transfer_in': 'fas fa-arrow-down',
            'transfer_out': 'fas fa-arrow-up',
            'buy': 'fas fa-shopping-cart',
            'admin': 'fas fa-user-cog',
            'command': 'fas fa-terminal',
            'ban': 'fas fa-ban',
            'kick': 'fas fa-user-times',
            'warn': 'fas fa-exclamation-triangle'
        };
        return icons[action] || 'fas fa-circle';
    }

    function getLogColor(action) {
        const colors = {
            'daily': 'success',
            'work': 'primary',
            'transfer_in': 'info',
            'transfer_out': 'warning',
            'buy': 'secondary',
            'admin': 'danger',
            'command': 'primary',
            'ban': 'danger',
            'kick': 'warning',
            'warn': 'info'
        };
        return colors[action] || 'secondary';
    }

    function getTypeColor(type) {
        const colors = {
            'bitcoin': 'warning',
            'command': 'success',
            'protection': 'danger',
            'admin': 'info'
        };
        return colors[type] || 'secondary';
    }

    function getTypeName(type) {
        const names = {
            'bitcoin': '💰 Bitcoin',
            'command': '🎮 أمر',
            'protection': '🛡️ حماية',
            'admin': '⚙️ إدارة'
        };
        return names[type] || type;
    }

    function getActionName(action) {
        const names = {
            'daily': 'مكافأة يومية',
            'work': 'عمل',
            'transfer_in': 'تحويل وارد',
            'transfer_out': 'تحويل صادر',
            'buy': 'شراء',
            'admin': 'تعديل إداري',
            'command': 'تنفيذ أمر',
            'ban': 'حظر',
            'kick': 'طرد',
            'warn': 'تحذير'
        };
        return names[action] || action;
    }

    function formatDateTime(timestamp) {
        if (!timestamp) return 'غير معروف';
        
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        
        return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    function showNotification(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow`;
        alertDiv.style.zIndex = '9999';
        alertDiv.style.minWidth = '300px';
        alertDiv.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                <span>${message}</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.classList.remove('show');
            setTimeout(() => alertDiv.remove(), 150);
        }, 3000);
    }

    // تحميل البيانات عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', loadLogs);
</script>
{% endblock %}
