{% extends "base.html" %}

{% block content %}
<!-- عنوان الصفحة -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">
        <i class="fas fa-terminal text-primary me-2"></i>
        إدارة الأوامر
    </h2>
    <button class="btn btn-outline-primary btn-sm" onclick="loadCommands()">
        <i class="fas fa-sync-alt me-1"></i> تحديث
    </button>
</div>

<!-- كروت الإحصائيات -->
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">إجمالي الأوامر</p>
                        <h3 class="fw-bold mb-0" id="total-commands">0</h3>
                    </div>
                    <div class="stats-icon bg-primary bg-opacity-10 text-primary">
                        <i class="fas fa-list"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">الأوامر المفعّلة</p>
                        <h3 class="fw-bold mb-0 text-success" id="enabled-commands">0</h3>
                    </div>
                    <div class="stats-icon bg-success bg-opacity-10 text-success">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card border-0 shadow-sm stats-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small">الأوامر المعطّلة</p>
                        <h3 class="fw-bold mb-0 text-danger" id="disabled-commands">0</h3>
                    </div>
                    <div class="stats-icon bg-danger bg-opacity-10 text-danger">
                        <i class="fas fa-times-circle"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- شريط البحث والفلترة -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-light">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="search-input" 
                        placeholder="ابحث عن أمر..."
                        oninput="filterCommands()"
                    >
                </div>
            </div>
            <div class="col-md-6">
                <select class="form-select" id="category-filter" onchange="filterCommands()">
                    <option value="all">📂 جميع الأقسام</option>
                    <option value="levels">📊 المستويات</option>
                    <option value="economy">💰 الاقتصاد</option>
                    <option value="games">🎮 الألعاب</option>
                    <option value="music">🎵 الموسيقى</option>
                    <option value="tickets">🎫 التذاكر</option>
                    <option value="invites">🎟️ الدعوات</option>
                    <option value="ai">🤖 الذكاء الاصطناعي</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- جدول الأوامر -->
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-0 py-3">
        <h5 class="mb-0 fw-bold">
            <i class="fas fa-cogs text-primary me-2"></i>
            قائمة الأوامر
        </h5>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">#</th>
                        <th>اسم الأمر</th>
                        <th>الوصف</th>
                        <th>القسم</th>
                        <th class="text-center">الحالة</th>
                        <th class="text-center pe-4">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="commands-table-body">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">جاري التحميل...</span>
                            </div>
                            <p class="text-muted mt-2">جاري تحميل الأوامر...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal لتأكيد التعطيل -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="confirmModalLabel">تأكيد العملية</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
                <p id="confirmModalText" class="mb-0"></p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" id="confirmModalBtn">تأكيد</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allCommands = [];
    let confirmCallback = null;
    let confirmModal = null;

    // تهيئة Modal
    document.addEventListener('DOMContentLoaded', function() {
        const modalEl = document.getElementById('confirmModal');
        confirmModal = new bootstrap.Modal(modalEl);
        loadCommands();
    });

    // تحميل الأوامر من API
    async function loadCommands() {
        try {
            const response = await fetch('/api/commands');
            const result = await response.json();
            
            if (result.success) {
                allCommands = result.data;
                updateStats();
                renderCommands(allCommands);
            } else {
                showNotification('خطأ في تحميل الأوامر', 'danger');
            }
        } catch (error) {
            console.error('خطأ:', error);
            showNotification('حدث خطأ في الاتصال', 'danger');
        }
    }

    // تحديث إحصائيات الأوامر
    function updateStats() {
        const total = allCommands.length;
        const enabled = allCommands.filter(c => c.enabled).length;
        const disabled = total - enabled;
        
        document.getElementById('total-commands').textContent = total;
        document.getElementById('enabled-commands').textContent = enabled;
        document.getElementById('disabled-commands').textContent = disabled;
    }

    // فلترة الأوامر
    function filterCommands() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const category = document.getElementById('category-filter').value;
        
        let filtered = allCommands;
        
        // فلترة بالبحث
        if (searchTerm) {
            filtered = filtered.filter(cmd => 
                cmd.name.toLowerCase().includes(searchTerm) ||
                cmd.description.toLowerCase().includes(searchTerm)
            );
        }
        
        // فلترة بالقسم
        if (category !== 'all') {
            filtered = filtered.filter(cmd => cmd.category === category);
        }
        
        renderCommands(filtered);
    }

    // عرض الأوامر في الجدول
    function renderCommands(commands) {
        const tbody = document.getElementById('commands-table-body');
        
        if (commands.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-5">
                        <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                        <p class="text-muted mb-0">لا توجد أوامر مطابقة</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        tbody.innerHTML = commands.map((cmd, index) => `
            <tr>
                <td class="ps-4 align-middle">
                    <span class="badge bg-light text-dark">${index + 1}</span>
                </td>
                <td class="align-middle">
                    <div class="d-flex align-items-center">
                        <div class="command-icon bg-${getCategoryColor(cmd.category)} bg-opacity-10 text-${getCategoryColor(cmd.category)} me-2">
                            <i class="${getCategoryIcon(cmd.category)}"></i>
                        </div>
                        <code class="fw-bold">/${cmd.name}</code>
                    </div>
                </td>
                <td class="align-middle text-muted">${cmd.description}</td>
                <td class="align-middle">
                    <span class="badge bg-${getCategoryColor(cmd.category)} bg-opacity-10 text-${getCategoryColor(cmd.category)}">
                        ${getCategoryName(cmd.category)}
                    </span>
                </td>
                <td class="align-middle text-center">
                    <div class="form-check form-switch d-inline-block">
                        <input 
                            class="form-check-input" 
                            type="checkbox" 
                            role="switch"
                            id="switch-${cmd.name}"
                            ${cmd.enabled ? 'checked' : ''}
                            onchange="toggleCommand('${cmd.name}', this.checked)"
                        >
                    </div>
                </td>
                <td class="align-middle text-center pe-4">
                    <button 
                        class="btn btn-sm btn-outline-${cmd.enabled ? 'danger' : 'success'}"
                        onclick="toggleCommand('${cmd.name}', ${!cmd.enabled})"
                    >
                        <i class="fas fa-${cmd.enabled ? 'times' : 'check'} me-1"></i>
                        ${cmd.enabled ? 'تعطيل' : 'تفعيل'}
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // تفعيل/تعطيل أمر
    async function toggleCommand(commandName, enabled) {
        const actionText = enabled ? 'تفعيل' : 'تعطيل';
        
        // تأكيد العملية
        showConfirm(
            `هل أنت متأكد من ${actionText} الأمر <code>/${commandName}</code>؟`,
            async () => {
                try {
                    const response = await fetch('/api/commands/toggle', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            command: commandName,
                            enabled: enabled
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // تحديث الحالة في القائمة
                        const cmd = allCommands.find(c => c.name === commandName);
                        if (cmd) {
                            cmd.enabled = enabled;
                        }
                        
                        updateStats();
                        filterCommands();
                        showNotification(result.message, 'success');
                    } else {
                        showNotification(result.error || 'حدث خطأ', 'danger');
                    }
                } catch (error) {
                    console.error('خطأ:', error);
                    showNotification('حدث خطأ في الاتصال', 'danger');
                }
            }
        );
    }

    // عرض Modal التأكيد
    function showConfirm(message, callback) {
        document.getElementById('confirmModalText').innerHTML = message;
        confirmCallback = callback;
        confirmModal.show();
    }

    // زر التأكيد في Modal
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('confirmModalBtn').addEventListener('click', function() {
            if (confirmCallback) {
                confirmCallback();
                confirmCallback = null;
            }
            confirmModal.hide();
        });
    });

    // دوال مساعدة للأقسام
    function getCategoryColor(category) {
        const colors = {
            'levels': 'primary',
            'economy': 'warning',
            'games': 'success',
            'music': 'info',
            'tickets': 'secondary',
            'invites': 'dark',
            'ai': 'danger'
        };
        return colors[category] || 'secondary';
    }

    function getCategoryIcon(category) {
        const icons = {
            'levels': 'fas fa-chart-line',
            'economy': 'fas fa-coins',
            'games': 'fas fa-gamepad',
            'music': 'fas fa-music',
            'tickets': 'fas fa-ticket-alt',
            'invites': 'fas fa-user-plus',
            'ai': 'fas fa-robot'
        };
        return icons[category] || 'fas fa-terminal';
    }

    function getCategoryName(category) {
        const names = {
            'levels': '📊 المستويات',
            'economy': '💰 الاقتصاد',
            'games': '🎮 الألعاب',
            'music': '🎵 الموسيقى',
            'tickets': '🎫 التذاكر',
            'invites': '🎟️ الدعوات',
            'ai': '🤖 الذكاء الاصطناعي'
        };
        return names[category] || category;
    }

    // عرض الإشعارات
    function showNotification(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-3 shadow`;
        alertDiv.style.zIndex = '9999';
        alertDiv.style.minWidth = '300px';
        alertDiv.innerHTML = `
            <div class="d-flex align-items-center">
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                <span>${message}</span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        document.body.appendChild(alertDiv);
        
        setTimeout(() => {
            alertDiv.classList.remove('show');
            setTimeout(() => alertDiv.remove(), 150);
        }, 3000);
    }
</script>
{% endblock %}
